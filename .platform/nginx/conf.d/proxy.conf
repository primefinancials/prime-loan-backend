# The app accepts base64-encoded KYC documents and a face-verification video in
# JSON bodies. nginx's default 1m limit rejects those with 413. Also give slow
# upstream calls (VFD / Mono / Flutterwave during a request) room before nginx
# times out.
client_max_body_size 30M;
client_body_timeout 120s;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
send_timeout 120s;
